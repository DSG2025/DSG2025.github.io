name: Temporary PR5 visual and regression QA
on:
  push:
    branches: [homepage-100-plus-guest-reviews-20261014]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for baseline regression check
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build and run full existing regression suite
        run: |
          npm run build
          node scripts/check-cta-form.cjs
          node scripts/check-homepage-behavior.cjs
          python3 scripts/check-homepage.py
          bash verify-custom-trip.sh .
          node --check assets/js/main.js
          node --check assets/js/home.js
          node --check assets/js/site-data.js
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright
      - name: Desktop, tablet and mobile real Chromium smoke tests
        run: |
          mkdir -p artifacts
          python3 -m http.server 4173 --directory dist >/tmp/og-pr5-server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            try {
              for (const cfg of [{name:'desktop',width:1440,height:900,cols:3},{name:'tablet',width:768,height:1024,cols:3},{name:'mobile',width:390,height:844,cols:1}]) {
                const page = await browser.newPage({viewport:{width:cfg.width,height:cfg.height},deviceScaleFactor:1});
                const errors=[];
                page.on('pageerror', e => errors.push(String(e)));
                const response = await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
                assert.equal(response.status(),200);
                const review=page.locator('#trust .trust-review');
                assert.equal(await review.count(),1);
                assert.equal(await review.locator('strong').innerText(),'100+ Guest Reviews');
                assert.equal(await review.locator('span').innerText(),'Personal experiences, thoughtfully tailored to you.');
                assert.equal(await review.getAttribute('href'),'#traveler-reviews');
                const info=await page.evaluate(() => {
                  const trust=document.querySelector('#trust'),a=trust.querySelector('.trust-review');
                  const b=a.getBoundingClientRect(),s=getComputedStyle(a),grid=trust.querySelector('.trust-grid');
                  return {viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,reviewLeft:b.left,reviewRight:b.right,columns:getComputedStyle(grid).gridTemplateColumns.split(' ').length,background:s.backgroundColor,heroImageReady:!!document.querySelector('.hero-picture img')?.naturalWidth};
                });
                assert.equal(info.columns,cfg.cols,JSON.stringify(info));
                assert(info.reviewLeft>=-1 && info.reviewRight<=cfg.width+1,JSON.stringify(info));
                assert(info.scrollWidth<=cfg.width+1,'Horizontal overflow: '+JSON.stringify(info));
                assert(info.heroImageReady,'Hero image did not load: '+JSON.stringify(info));
                assert.equal(await page.locator('#traveler-reviews .review-platform-proof').count(),3);
                assert.equal(await page.locator('#home-hero .hero-actions .btn.primary').count(),1);
                assert.deepEqual(errors,[],'Browser JS exceptions');
                await page.screenshot({path:'artifacts/home-'+cfg.name+'.png'});
                await review.screenshot({path:'artifacts/reviews-'+cfg.name+'.png'});
                await review.click();
                assert.equal(new URL(page.url()).hash,'#traveler-reviews');
                console.log('PASS '+cfg.name+': '+JSON.stringify(info)+'; review scroll target works; no JS errors');
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e.stack||e); process.exit(1); });
          NODE
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: og-pr5-browser-screenshots
          path: artifacts/
          if-no-files-found: warn
